name: build

# Push/PR: Windows test + installer (cheap). Tags and manual runs: Windows + macOS, and tags publish a Release.
# macOS runners bill at 10x on private repos, so they only run when asked.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Also build macOS
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            args: ""
          - os: macos-latest
            name: macOS
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            name: Linux
            args: "--bundles rpm,deb,appimage"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip macOS unless tagged or requested
        id: gate
        shell: bash
        run: |
          run=true
          if [ "${{ matrix.name }}" = "macOS" ] && [ "${{ startsWith(github.ref, 'refs/tags/v') }}" != "true" ] && [ "${{ github.event.inputs.macos }}" != "true" ]; then run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - name: Linux build dependencies
        if: steps.gate.outputs.run == 'true' && matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.run == 'true'
        with:
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.run == 'true'
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20
      - uses: microsoft/setup-msbuild@v2
        if: steps.gate.outputs.run == 'true' && matrix.name == 'Windows'
      - name: Build the bekdesk camera (Softcam v1.8.1, MIT, pinned commit)
        if: steps.gate.outputs.run == 'true' && matrix.name == 'Windows'
        shell: bash
        run: |
          git clone --quiet https://github.com/tshino/softcam.git softcam
          git -C softcam checkout --quiet afb424c2415b04da627fa1a7b4706575c2ba3010
          # Shown in camera lists as "bekdesk camera".
          sed -i 's/L"DirectShow Softcam"/L"bekdesk camera"/' softcam/src/softcam/softcam.cpp
          # Only the camera DLL (and what it links); Softcam's own test projects need NuGet packages.
          MSBuild.exe softcam/softcam.sln -t:softcam -p:Configuration=Release -p:Platform=x64 -m -v:minimal
          mkdir -p src-tauri/resources
          cp softcam/dist/bin/x64/softcam.dll src-tauri/resources/softcam.dll
      - name: Tests
        if: steps.gate.outputs.run == 'true'
        working-directory: src-tauri
        run: cargo test --lib --test e2e
      - name: Build installer
        if: steps.gate.outputs.run == 'true'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1 # CI runners have no FUSE
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}
      - name: Collect
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          mkdir dist
          if [ "${{ matrix.name }}" = "Windows" ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe dist/bekdesk-Windows-x64-Setup.exe
          elif [ "${{ matrix.name }}" = "Linux" ]; then
            cp src-tauri/target/release/bundle/rpm/*.rpm dist/bekdesk-Linux-x86_64.rpm
            cp src-tauri/target/release/bundle/deb/*.deb dist/bekdesk-Linux-amd64.deb
            cp src-tauri/target/release/bundle/appimage/*.AppImage dist/bekdesk-Linux-x86_64.AppImage
          else
            cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/bekdesk-macOS-universal.dmg
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: bekdesk-${{ matrix.name }}
          path: dist/*
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Third-party license report
        run: |
          cd src-tauri && cargo about generate -c ../about.toml ../about.hbs -o ../dist/THIRD_PARTY_LICENSES.html
      - name: Checksums and docs
        run: |
          cp LICENSE THIRD_PARTY.md docs/INSTALL.md dist/
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: docs/RELEASE_NOTES.md
          prerelease: true
